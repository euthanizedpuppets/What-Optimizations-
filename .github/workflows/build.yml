name: Build

on:
  push:
    branches: [main, 'phase1/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-build-smoke:
    name: CLI and Java compile smoke build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Normalize Rust source before CLI checks
        run: cargo fmt --manifest-path native/Cargo.toml --all
      - name: Build through the committed Gradle wrapper
        run: ./gradlew build nativeTest nativeFormatCheck --stacktrace
      - name: Upload Linux-only smoke-test JAR
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-mod-jar-linux-smoke
          path: build/libs/what-optimizations-0.1.0.jar
          if-no-files-found: error
          retention-days: 14

  rustfmt-writeback:
    name: One-shot Rust formatting writeback
    if: github.event_name == 'push' && github.ref == 'refs/heads/phase1/mesher-correctness-tests' && github.event.head_commit.message == 'Run one-shot Rust formatting writeback'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Format Rust source
        run: cargo fmt --manifest-path native/Cargo.toml --all
      - name: Commit formatted Rust files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/src
          if git diff --cached --quiet; then
            echo "Rust source already formatted"
            exit 0
          fi
          git commit -m "Format Rust sources"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  native:
    name: Native - ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os: linux
          - runner: windows-latest
            os: windows
          - runner: macos-latest
            os: macos
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Format and check Rust source
        run: |
          cargo fmt --manifest-path native/Cargo.toml
          cargo fmt --manifest-path native/Cargo.toml -- --check
          git diff --check
      - name: Test native crate
        run: cargo test --manifest-path native/Cargo.toml
      - name: Build optimized native library
        run: cargo build --release --manifest-path native/Cargo.toml
      - name: Stage native artifact for the actual runner architecture
        shell: bash
        run: |
          host="$(rustc -vV | sed -n 's/^host: //p')"
          case "$host" in
            x86_64-unknown-linux-gnu) platform=linux-x86_64; library=libwhat_optimizations_native.so ;;
            aarch64-unknown-linux-gnu) platform=linux-aarch64; library=libwhat_optimizations_native.so ;;
            x86_64-pc-windows-msvc|x86_64-pc-windows-gnu) platform=windows-x86_64; library=what_optimizations_native.dll ;;
            aarch64-pc-windows-msvc) platform=windows-aarch64; library=what_optimizations_native.dll ;;
            aarch64-apple-darwin) platform=macos-aarch64; library=libwhat_optimizations_native.dylib ;;
            x86_64-apple-darwin) platform=macos-x86_64; library=libwhat_optimizations_native.dylib ;;
            *) echo "Unsupported CI Rust target: $host"; exit 1 ;;
          esac
          mkdir -p "build/native-output/natives/$platform"
          cp "native/target/release/$library" "build/native-output/natives/$platform/"
          echo "Staged $library for $platform"
      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}
          path: build/native-output/
          if-no-files-found: error
          retention-days: 14
      - name: Publish rustfmt output for source review
        if: matrix.os == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-source
          path: native/src/
          if-no-files-found: error
          retention-days: 7

  mod-jar:
    name: Build Minecraft mod jar
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all native platform libraries
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: build/generated/nativeResources
          merge-multiple: true
      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle 9.7.0 (required by Loom 1.18.3)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Build mod and bundle native libraries
        run: gradle build --stacktrace
      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-mod-jar
          path: build/libs/what-optimizations-0.1.0.jar
          if-no-files-found: error
          retention-days: 14
