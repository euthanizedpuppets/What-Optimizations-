plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

loom {
    splitEnvironmentSourceSets()

    mods {
        'what-optimizations' {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

// Native libraries generated by CI (and the current host's buildNative task)
// are added to the main resource set so they are embedded in the mod jar.
sourceSets.main.resources.srcDir(layout.buildDirectory.dir('generated/nativeResources'))

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

jar {
    from('LICENSE') {
        into 'META-INF'
        rename { 'LICENSE_what-optimizations' }
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.register('buildNative', Exec) {
    group = 'build'
    description = 'Builds the Rust JNI cdylib in release mode.'
    workingDir projectDir
    commandLine 'cargo', 'build', '--release', '--manifest-path', 'native/Cargo.toml'
}

tasks.register('stageNative') {
    group = 'build'
    description = 'Stages this host platform native library into generated jar resources.'
    dependsOn tasks.named('buildNative')

    doLast {
        def osName = System.getProperty('os.name').toLowerCase(Locale.ROOT)
        def archName = System.getProperty('os.arch').toLowerCase(Locale.ROOT)

        def platform = osName.contains('win') ? 'windows' :
                (osName.contains('mac') || osName.contains('darwin') ? 'macos' :
                (osName.contains('linux') ? 'linux' : null))
        def arch = (archName in ['amd64', 'x86_64']) ? 'x86_64' :
                (archName in ['aarch64', 'arm64'] ? 'aarch64' : null)

        if (platform == null || arch == null) {
            throw new GradleException("Unsupported native build host: ${osName}/${archName}")
        }

        def libraryName = platform == 'windows' ? 'what_optimizations_native.dll' :
                (platform == 'macos' ? 'libwhat_optimizations_native.dylib' : 'libwhat_optimizations_native.so')
        def builtLibrary = file("native/target/release/${libraryName}")
        if (!builtLibrary.isFile()) {
            throw new GradleException("Cargo succeeded but native library was not found at ${builtLibrary}")
        }

        def destination = file("build/generated/nativeResources/natives/${platform}-${arch}/${libraryName}")
        destination.parentFile.mkdirs()
        destination.bytes = builtLibrary.bytes
        logger.lifecycle("Staged native library: ${destination}")
    }
}

tasks.named('processResources') {
    dependsOn tasks.named('stageNative')
}

tasks.named('build') {
    dependsOn tasks.named('stageNative')
}
